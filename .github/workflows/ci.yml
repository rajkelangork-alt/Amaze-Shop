name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Frontend Build Check
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: Amz-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./Amz-frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./Amz-frontend
        run: npm run build

      # 2. Backend Lint / Syntax Check
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        working-directory: ./Amz-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt